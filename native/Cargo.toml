[package]
name = "diner-dash-native"
version = "0.1.0"
edition = "2021"
authors = ["Nirusaki"]
description = "Diner Dash - Made by Nirusaki"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "diner_dash"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "diner-dash"
path = "src/main.rs"

[dependencies]
diner-dash-engine = { path = "../engine" }
macroquad = { version = "=0.4.14", features = ["audio"] }
serde_json = { workspace = true }
serde = { workspace = true }
dirs = "5.0"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
