[workspace]
resolver = "2"
members = [
    "tools/extract",
    "tools/cst_parser",
    "engine",
    "wasm",
    "native",
]
exclude = ["tools/extract/target", "engine/target", "wasm/target"]

[workspace.dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bitflags = "2.0"

# Image processing
image = { version = "0.25", features = ["png", "jpeg", "bmp"] }
png = "0.17"

# Audio
symphonia = { version = "0.5", features = ["ogg", "vorbis", "mp3", "wav"] }
cpal = { version = "0.15", features = ["jack", "pulse", "alsa", "wasapi", "coreaudio"] }

# Math
glam = { version = "0.28", features = ["serde"] }
euclid = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "DomRect",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "HtmlAudioElement",
    "CanvasRenderingContext2d",
    "WebGl2RenderingContext",
    "AudioContext",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioParam",
    "GainNode",
    "OscillatorNode",
    "OscillatorType",
    "MouseEvent",
    "KeyboardEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "Storage",
    "Performance",
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    "IdbRequest",
    "Event",
    "console",
] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"

# wgpu
wgpu = { version = "23.0", features = ["webgl"] }
wgpu-types = "23.0"

# Async
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }

# Asset handling
ron = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
dirs = "5.0"